name: glimmer-touch test DMG

on:
  push:
    branches: [codex/mac-touchscreen, codex/control-copy-paste]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    if: github.repository == 'AlekKwek18/glimmer'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build unsigned app
        run: make app DERIVED="$RUNNER_TEMP/glimmer-build"

      - name: Test keyboard and helper behavior
        run: |
          xcodebuild test -project Glimmer.xcodeproj -scheme Glimmer -configuration Debug \
            -xcconfig Glimmer/StreamLib.xcconfig CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/glimmer-build" -destination 'platform=macOS' \
            -only-testing:GlimmerTests/StreamTextRoutingTests \
            -only-testing:GlimmerTests/PasteTextTests \
            -only-testing:GlimmerTests/AWDLHelperTests \
            -only-testing:GlimmerTests/MenuBarPresentationTests

      - name: Package test disk image
        run: |
          staging="$RUNNER_TEMP/glimmer-dmg"
          mkdir -p "$staging"
          ditto "$RUNNER_TEMP/glimmer-build/Build/Products/Debug/Glimmer.app" "$staging/glimmer-touch.app"
          plist="$staging/glimmer-touch.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :SUFeedURL' "$plist"
          /usr/libexec/PlistBuddy -c 'Set :SUEnableAutomaticChecks false' "$plist"
          dmg="$RUNNER_TEMP/glimmer-touch-unsigned.dmg"
          hdiutil create -srcfolder "$staging" -volname "glimmer-touch" -format UDZO "$dmg"
          hdiutil verify "$dmg"

      - name: Upload test DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glimmer-touch-unsigned
          path: ${{ runner.temp }}/glimmer-touch-unsigned.dmg
          if-no-files-found: error
          retention-days: 1
